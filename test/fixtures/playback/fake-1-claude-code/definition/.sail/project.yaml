# The fixture repository's config: every port on its fake adapter.
name: fixture
sail: ">=0.0.0 <1"
label: sail
defaultWorkflow: ticket-to-pr
adapters:
  ticketSource: { use: fake, seed: ./fake/tickets.json }
  codeHost: { use: fake, seed: ./fake/prs.json }
  harness: { use: claude-code }
  workspace: { use: fake }
models: { default: sonnet, deep: opus }
budgets: { run: { maxUsd: 25, maxMinutes: 90 } }
