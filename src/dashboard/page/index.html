<!doctype html>
<html lang="en" data-theme="dark" data-inspector="closed" data-pinned="false" data-detail="closed" data-sidebar="closed">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sail dashboard</title>
    <style>
      :root[data-theme="dark"],
      :root[data-theme="system"] {
        --bg: #0b0b0f;
        --panel: #111117;
        --panel-2: #16161e;
        --hover: #1d1d28;
        --inset: #08080c;
        --line: rgba(255, 255, 255, 0.08);
        --line-2: rgba(255, 255, 255, 0.18);
        --fg: #ececf4;
        --fg-2: #b4b4c8;
        --fg-3: #9a9ab0;
        --fg-4: #85859b;
        --focus: #6ea4ff;
        --add: #6ee7b7;
        --del: #fda4af;
      }
      :root[data-theme="light"] {
        --bg: #dee0e9;
        --panel: #f2f3f7;
        --panel-2: #e8e9f0;
        --hover: #d6d8e4;
        --inset: #e9eaf1;
        --line: rgba(24, 26, 60, 0.16);
        --line-2: rgba(24, 26, 60, 0.32);
        --fg: #14151f;
        --fg-2: #383a52;
        --fg-3: #4d4f6a;
        --fg-4: #565973;
        --focus: #1d5fd6;
        --add: #0c6535;
        --del: #a31b29;
        --ok: #055c43;
        --warn: #7a4800;
        --err: #9d1235;
        --run: #1d4bb5;
        --idle: #565973;
      }
      @media (prefers-color-scheme: light) {
        :root[data-theme="system"] {
          --bg: #dee0e9;
          --panel: #f2f3f7;
          --panel-2: #e8e9f0;
          --hover: #d6d8e4;
          --inset: #e9eaf1;
          --line: rgba(24, 26, 60, 0.16);
          --line-2: rgba(24, 26, 60, 0.32);
          --fg: #14151f;
          --fg-2: #383a52;
          --fg-3: #4d4f6a;
          --fg-4: #565973;
          --focus: #1d5fd6;
          --add: #0c6535;
          --del: #a31b29;
          --ok: #055c43;
          --warn: #7a4800;
          --err: #9d1235;
          --run: #1d4bb5;
          --idle: #565973;
        }
      }
      :root {
        --row-h: 28px;
        --group-h: 28px;
        --list-head-h: 40px;
        --ok: #34d399;
        --warn: #f5a623;
        --err: #f43f5e;
        --run: #4c8dff;
        --idle: #66667e;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--fg);
        height: 100vh;
        overflow: hidden;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
      }
      a {
        color: var(--run);
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .r-open:focus-visible,
      .q-open:focus-visible,
      .qsec:focus-visible,
      .qrecent-h:focus-visible,
      .trow:focus-visible {
        outline-offset: -2px;
      }
      button,
      select,
      input:not([type="checkbox"]):not([type="radio"]),
      [role="button"] {
        min-height: 24px;
      }
      .r-more,
      .btn.mv {
        min-width: 24px;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 24px;
      }
      a.c-t {
        min-height: 24px;
      }
      .wf-act,
      .r-more {
        display: inline-flex;
        align-items: center;
      }
      code,
      pre {
        font-family: var(--mono);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }

      /* the shell: top bar, sidebar, list, run view, inspector and status bar */
      .shell {
        display: grid;
        grid-template-rows: 46px 1fr 26px;
        height: 100vh;
      }
      .body {
        display: grid;
        grid-template-columns: var(--side-w, 180px) 5px minmax(0, 1fr);
        overflow: hidden;
      }
      /* a run or queue open beside the list: the run view keeps 320px and the list gives way first */
      :root[data-detail="open"] .body {
        grid-template-columns: var(--side-w, 180px) 5px minmax(0, var(--list-w, 340px)) minmax(320px, 1fr);
      }
      .resize-handle {
        cursor: col-resize;
        position: relative;
        z-index: 10;
        transition: background 0.15s;
      }
      .resize-handle:hover {
        background: var(--line-2);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 0 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 650;
      }
      .brand i {
        width: 19px;
        height: 19px;
        border-radius: 5px;
        background: linear-gradient(135deg, #4c8dff, #34d399);
      }
      .sidebar-btn,
      .back,
      .ins-close {
        display: none;
      }
      .spacer {
        flex: 1;
      }
      .btn {
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--fg-2);
      }
      .btn:hover {
        border-color: var(--line-2);
        color: var(--fg);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        border-color: var(--fg);
      }
      .dlg {
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--inset);
        color: var(--fg);
        padding: 16px 18px;
        max-width: min(460px, 90vw);
      }
      .dlg::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      .dlg-lines {
        margin: 8px 0 14px;
        padding-left: 18px;
        font-size: 12px;
      }
      .dlg-fields {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .dlg-bad {
        color: var(--del);
      }
      .dlg .num {
        width: 7em;
      }
      .dlg-acts {
        display: flex;
        gap: 8px;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .act {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .act-why {
        color: var(--fg-4);
      }
      .act .num {
        width: 7em;
      }
      .c-side {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .qmore {
        position: relative;
        display: inline-flex;
      }
      .btn.more.open {
        border-color: var(--line-2);
        color: var(--fg);
      }
      .h-acts {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .h-more {
        position: relative;
      }
      .h-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 5;
        min-width: 14em;
        padding: 8px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .h-menu .acts {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .h-menu .act {
        flex-wrap: wrap;
      }
      .qmenu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 10em;
        padding: 4px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .qmenu .btn {
        text-align: left;
        padding: 5px 10px;
        border-color: transparent;
        background: transparent;
      }
      .qmenu .btn:hover {
        background: var(--panel-2);
      }
      .srcbar .btn {
        padding: 1px 6px;
        font-size: 10px;
        line-height: 1.4;
      }
      .srcbar .h-acts {
        margin-left: auto;
      }
      .qadd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
      }
      .qadd .txt {
        width: 14em;
      }
      .mv-gap {
        width: 28px;
      }
      .btn.mv {
        min-width: 28px;
        padding: 2px 8px;
        line-height: 1.4;
      }
      .qsec .caret,
      .qrecent-h .caret {
        transition: transform 0.12s;
      }
      .qsec.open .caret,
      .qrecent-h.open .caret {
        transform: rotate(90deg);
      }

      /* status colours, for dots and pills */
      .st.p-pass {
        background: var(--ok);
      }
      .st.p-fail {
        background: var(--err);
      }
      .st.p-run {
        background: var(--run);
        animation: pulse 1.4s infinite;
      }
      .st.p-warn {
        background: var(--warn);
      }
      .st.p-skip,
      .st.p-pend {
        background: var(--idle);
      }
      .pill {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        flex: 0 0 auto;
      }
      .pill.p-pass {
        background: color-mix(in srgb, var(--ok) 14%, transparent);
        color: var(--ok);
      }
      .pill.p-fail {
        background: color-mix(in srgb, var(--err) 14%, transparent);
        color: var(--err);
      }
      .pill.p-run {
        background: color-mix(in srgb, var(--run) 16%, transparent);
        color: var(--run);
      }
      .pill.p-warn {
        background: color-mix(in srgb, var(--warn) 16%, transparent);
        color: var(--warn);
      }
      .pill.p-skip {
        background: color-mix(in srgb, var(--idle) 22%, transparent);
        color: var(--fg-2);
      }
      .pill.p-pend {
        background: var(--panel-2);
        color: var(--fg-4);
        border: 1px solid var(--line);
      }
      .warnchip {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        color: var(--warn);
      }
      .retry {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--err);
      }
      /* the sidebar: navigation that never grows with activity */
      .side {
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        overflow-x: hidden;
        min-width: 0;
      }
      .side-views,
      .side-repos {
        display: flex;
        flex-direction: column;
      }
      .side-h {
        padding: 11px 12px 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .side-ent,
      .side-repo {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        min-height: var(--row-h);
        padding: 5px 12px;
        font-size: 12.5px;
        color: var(--fg-2);
        text-align: left;
        border-left: 2px solid transparent;
      }
      .side-ent:hover,
      .side-repo:hover {
        background: var(--hover);
      }
      .side-ent.on,
      .side-repo.on {
        background: var(--panel-2);
        border-left-color: var(--run);
        color: var(--fg);
      }
      .side-ent .nm,
      .side-repo .nm {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .side-ent .c {
        flex: 0 100 auto;
        min-width: 0;
        margin-left: auto;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-4);
      }
      .dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
      }
      .dot-watching {
        background: var(--ok);
      }
      .dot-idle {
        background: var(--fg-4);
      }
      .dot-broken {
        background: var(--err);
      }

      /* the list: one row per entry, at fixed heights, in folding groups */
      .list {
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      :root[data-detail="open"] .list {
        border-right: 1px solid var(--line);
      }
      .list-h {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-height: var(--list-head-h);
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
      }
      .lh-t {
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
      }
      .list-h .c,
      .lgh .c {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-4);
      }
      .lrow.picked {
        background: var(--panel-2);
        box-shadow: inset 2px 0 0 var(--fg-3);
      }
      .lh-sel {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-2);
      }
      .list-s {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 110px;
        padding: 2px 4px;
        font-family: var(--mono);
        font-size: 11.5px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--fg-2);
      }
      .list-f {
        flex: 1 1 100px;
        min-width: 0;
        margin-left: auto;
        padding: 2px 8px;
        font-family: var(--mono);
        font-size: 11.5px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--fg-2);
      }
      .lgrp {
        border-bottom: 1px solid var(--line);
      }
      .lgrp-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        padding-right: 12px;
      }
      .lgh {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: var(--group-h);
        padding: 4px 12px;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-3);
        text-align: left;
      }
      .lgrp-row .lgh {
        flex: 1 1 auto;
        width: auto;
      }
      .lgh:hover,
      .lgrp-row:hover {
        background: var(--hover);
      }
      .lgh .nm {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .lgh .lcaret {
        font-size: 11px;
        color: var(--fg-4);
        transition: transform 0.12s;
      }
      .lgh.open .lcaret {
        transform: rotate(90deg);
      }
      .lgh.cur,
      .lgrp-row.cur,
      .lrow.cur,
      .q-row.cur {
        box-shadow: inset 2px 0 0 var(--focus);
      }
      .lgrp-p {
        padding: 0 12px 6px 34px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--del);
        overflow-wrap: anywhere;
      }
      .wf-act {
        flex: 0 0 auto;
        padding: 0 5px;
        font-family: var(--mono);
        font-size: 10px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--fg-3);
        white-space: normal;
        text-align: left;
      }
      .wf-act:hover {
        border-color: var(--line-2);
        color: var(--fg);
      }
      .wf-watch {
        flex: 0 0 auto;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--fg-4);
        white-space: nowrap;
      }
      .wf-watch.on {
        color: var(--ok);
      }
      .wf-watch.down {
        color: var(--warn);
      }
      .qadd .txt[disabled] {
        opacity: 0.5;
      }
      .run {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        width: 100%;
        min-height: var(--row-h);
        padding: 0 12px 0 10px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-2);
        border-left: 2px solid transparent;
      }
      .run:hover {
        background: var(--hover);
      }
      .run.sel {
        background: var(--panel-2);
        border-left-color: var(--run);
        color: var(--fg);
      }
      .r-open {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        min-height: var(--row-h);
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .r-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        min-height: var(--row-h);
        white-space: nowrap;
      }
      .r-line > * {
        min-width: 0;
      }
      .run .st {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .r-id {
        flex: 0 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .r-title {
        flex: 1 1 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--fg-2);
      }
      .r-wf,
      .r-el,
      .r-cost,
      .run .why,
      .run .stalled {
        flex: 0 4 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        color: var(--fg-4);
      }
      .run .stalled {
        color: var(--warn);
      }
      .run .why {
        color: var(--del);
      }
      .r-problem {
        display: block;
        padding: 0 0 5px 14px;
        font-size: 10.5px;
        color: var(--del);
        overflow-wrap: anywhere;
        white-space: normal;
      }
      /* beside the run view, the row gives up its workflow and cost */
      :root[data-detail="open"] .r-wf,
      :root[data-detail="open"] .r-cost {
        display: none;
      }
      .r-more {
        flex: 0 0 auto;
        align-self: center;
        opacity: 0;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel-2);
        color: var(--fg-3);
        line-height: 1.4;
      }
      .run:hover .r-more,
      .run:focus-within .r-more,
      .run.sel .r-more,
      .r-more.open {
        opacity: 1;
      }
      @media (hover: none) {
        .r-more {
          opacity: 1;
        }
      }
      .r-more:hover,
      .r-more.open {
        border-color: var(--line-2);
        color: var(--fg);
      }
      .r-menu {
        position: absolute;
        top: 100%;
        left: 34px;
        right: 10px;
        z-index: 5;
        padding: 8px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        overflow-wrap: anywhere;
      }
      .r-menu .acts {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .r-menu .act {
        flex-wrap: wrap;
      }
      .r-menu .act button,
      .r-menu .btn {
        white-space: normal;
        text-align: left;
      }
      .r-menu select {
        max-width: 100%;
        font-family: var(--mono);
        font-size: 12px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--fg-2);
      }
      .r-menu .act-why,
      .r-menu .warnchip {
        overflow-wrap: anywhere;
        white-space: normal;
      }
      .q-row {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-height: var(--row-h);
        padding: 4px 12px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-3);
        border-left: 2px solid transparent;
      }
      .q-open {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-height: var(--row-h);
        padding: 0;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .q-c,
      .q-polled {
        font-family: var(--mono);
        color: var(--fg-4);
        white-space: nowrap;
      }
      .q-c.failed {
        color: var(--del);
      }
      .q-c.parked {
        color: var(--warn);
      }
      .q-row .warnchip {
        overflow-wrap: anywhere;
        white-space: normal;
      }
      .wf-act[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .q-row .nm {
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: left;
      }
      .q-row .qd {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid var(--warn);
        flex: 0 0 auto;
      }
      .q-row:hover {
        background: var(--hover);
      }
      .q-row.sel {
        background: var(--panel-2);
        border-left-color: var(--warn);
        color: var(--fg);
      }
      .q-row .n {
        color: var(--warn);
      }
      .q-row {
        flex-wrap: wrap;
      }
      .q-row .r-problem {
        flex-basis: 100%;
        overflow-wrap: anywhere;
        text-align: left;
      }
      /* the Inbox's rows */
      .in-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        width: 100%;
        min-height: var(--row-h);
        padding: 0 12px 0 10px;
        font-family: var(--mono);
        font-size: 11.5px;
        border-left: 2px solid transparent;
      }
      .in-row.sel {
        background: var(--panel-2);
        color: var(--fg);
      }
      :root[data-pinned="true"] [data-action="toggle-inspector"] {
        border-color: var(--err);
        color: var(--fg);
      }
      .in-failed,
      .in-error {
        border-left-color: var(--err);
      }
      .in-parked,
      .in-problem {
        border-left-color: var(--del);
      }
      .r-dismiss {
        flex: none;
        align-self: center;
        padding: 0 8px;
        border: 0;
        background: transparent;
        color: var(--fg-4);
        cursor: pointer;
      }
      .r-dismiss:hover {
        color: var(--fg);
      }
      .r-detail {
        color: var(--fg-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .qempty {
        padding: 18px;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-4);
      }

      /* the centre: the run view and the queues */
      .main {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        min-width: 0;
      }
      :root:not([data-detail="open"]) .main {
        display: none;
      }
      .d-h {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 11px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .d-title {
        font-size: 15px;
        font-weight: 650;
      }
      .d-agent {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-4);
        margin-left: auto;
      }
      .d-msg {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--fg-2);
        background: var(--panel-2);
      }
      .run-b {
        padding: 14px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin-bottom: 12px;
      }
      .stat {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 17px;
      }
      .stat span {
        font-size: 10px;
        color: var(--fg-3);
        text-transform: uppercase;
      }
      .grp,
      .cgrp {
        margin-bottom: 14px;
      }
      .grp-t {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-bottom: 7px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        padding: 12px 13px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--line-2);
      }
      .card.cursor {
        box-shadow: 0 0 0 1px var(--run);
      }
      .card.sel {
        border-color: var(--run);
      }
      .card.pending {
        opacity: 0.45;
        cursor: default;
      }
      .c-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .c-n {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-4);
      }
      .c-name {
        font-size: 14px;
        font-weight: 650;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-agent {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-4);
      }
      .c-model {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: var(--panel-2);
      }
      .facts {
        display: flex;
        gap: 14px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-3);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .facts div {
        display: flex;
        flex-direction: column;
        padding: 6px 0;
      }
      .facts b {
        color: var(--fg);
        font-size: 13.5px;
      }
      .lbl {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--fg-4);
      }
      .c-msg {
        font-size: 12px;
        line-height: 1.5;
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .c-steps {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .c-foot {
        display: flex;
        gap: 8px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-4);
      }
      .cmds {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cmd {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cmd code {
        background: var(--inset);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .code {
        background: var(--inset);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 10px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.7;
        color: var(--fg-2);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 320px;
        overflow: auto;
        margin-bottom: 6px;
      }
      .code.log {
        max-height: none;
      }
      .code.bad {
        color: var(--del);
      }
      .busy {
        font-family: var(--mono);
        font-size: 11px;
        opacity: 0.7;
      }
      .menu:empty {
        display: none;
      }
      .cmdk-back {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.4);
        border: 0;
        cursor: default;
      }
      .cmdk {
        position: fixed;
        z-index: 61;
        top: 13vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(750px, 92vw);
        max-height: 70vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--fg);
        padding: 8px;
        font-family: var(--sans);
        font-size: 15px;
        box-shadow:
          0 28px 72px rgba(0, 0, 0, 0.3),
          0 2px 10px rgba(0, 0, 0, 0.12);
      }
      .cmdk.ctx {
        transform: none;
        width: min(300px, 92vw);
        border-radius: 10px;
        padding: 6px;
        font-size: 13px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
      }
      .cmdk-subj {
        align-self: flex-start;
        max-width: calc(100% - 16px);
        margin: 8px 8px 0;
        padding: 4px 10px;
        border-radius: 8px;
        background: var(--hover);
        color: var(--fg-2);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cmdk.ctx .cmdk-subj {
        margin: 2px 2px 4px;
        max-width: 100%;
        font-size: 12px;
      }
      .cmdk-in {
        margin: 0;
        padding: 16px 12px 14px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 17px;
      }
      .cmdk-in:focus-visible {
        outline: none;
      }
      .cmdk-in::placeholder {
        color: var(--fg-4);
      }
      .cmdk-step,
      .cmdk-grp {
        padding: 16px 12px 8px;
        color: var(--fg-3);
        font-size: 13px;
      }
      .cmdk-step::first-letter,
      .cmdk-grp::first-letter {
        text-transform: uppercase;
      }
      .cmdk-line {
        padding: 2px 12px;
        color: var(--fg-2);
        font-size: 13px;
      }
      .cmdk-err {
        padding: 4px 12px;
        color: var(--del);
        font-size: 13px;
      }
      .cmdk-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
        width: 100%;
        min-height: 44px;
        text-align: left;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        padding: 0 12px;
      }
      .cmdk.ctx .cmdk-row {
        min-height: 32px;
        padding: 0 8px;
        gap: 8px;
        border-radius: 6px;
      }
      .cmdk-row:hover {
        background: var(--panel-2);
      }
      .cmdk-row.sel {
        background: var(--hover);
      }
      .cmdk-row:disabled {
        color: var(--fg-4);
        cursor: default;
        background: transparent;
      }
      .cmdk-ico {
        order: -1;
        flex: none;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: var(--fg-2);
      }
      .cmdk-row:disabled .cmdk-ico {
        color: var(--fg-4);
      }
      .cmdk-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cmdk-row:disabled .cmdk-label {
        flex: 0 1 auto;
      }
      .cmdk-hint,
      .cmdk-why {
        color: var(--fg-3);
        font-size: 13px;
        white-space: nowrap;
      }
      .cmdk-row:disabled .cmdk-why {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--fg-4);
      }
      .cmdk-row:disabled .cmdk-why::before {
        content: "· ";
      }
      .cmdk-row kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        border: 1px solid var(--line-2);
        border-radius: 5px;
        background: var(--panel);
        color: var(--fg-2);
        font-family: var(--sans);
        font-size: 12px;
        text-transform: uppercase;
      }
      .cmdk-row:disabled kbd {
        opacity: 0.5;
      }
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: min(420px, 90vw);
      }
      .toast {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--inset);
        font-size: 12px;
      }
      .toast.bad {
        border-color: var(--del);
        color: var(--del);
      }
      .toast-head {
        font-weight: 600;
      }
      .hint {
        margin-bottom: 8px;
        padding: 6px 8px;
        border-radius: 5px;
        background: var(--inset);
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-3);
        border: 1px solid var(--line);
      }

      /* the queue view */
      .qpanel {
        border-bottom: 1px solid var(--line);
      }
      .srcbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 9px 14px;
        background: var(--panel);
      }
      .srcbar .h {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }
      .srcbar .h.held {
        background: var(--warn);
      }
      .srcbar .nm {
        font-weight: 650;
      }
      .srcbar .dt {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-3);
      }
      .statebar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 7px 14px;
      }
      .sf {
        font-family: var(--mono);
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 5px;
        border: 1px solid var(--line);
        color: var(--fg-3);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sf .d,
      .c-dot i {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .queued {
        border: 1.5px solid var(--warn);
      }
      i.dispatched {
        background: var(--run);
      }
      i.failed,
      i.parked {
        background: var(--err);
      }
      i.done {
        background: var(--ok);
      }
      .qrow2 {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
      }
      .qrow2.done {
        opacity: 0.6;
      }
      .qsec {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 12px 14px 0;
      }
      .qsec:hover {
        color: var(--fg-2);
      }
      .qbox {
        margin: 0 14px 4px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
      }
      .qbox .qrow2:first-child {
        border-top: 0;
      }
      .run-link {
        flex: 0 0 auto;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--run);
      }
      .run-link:hover {
        text-decoration: underline;
      }
      .qrecent-h {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 14px 14px 8px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .qrecent-h:hover {
        color: var(--fg-2);
      }
      .qrecent-h .n {
        color: var(--fg-4);
      }
      .c-dot {
        flex: 0 0 8px;
        padding-top: 5px;
      }
      .c-ref {
        flex: 0 0 110px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .c-main {
        flex: 1;
        min-width: 0;
      }
      .c-t {
        display: block;
        overflow-wrap: anywhere;
      }
      a.c-t {
        color: var(--fg);
        text-decoration: none;
      }
      a.c-t:hover {
        text-decoration: underline;
      }
      .c-sub {
        display: block;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--fg-4);
        margin-top: 2px;
      }
      .qrecent {
        padding: 6px 0 10px;
      }
      .ev {
        display: flex;
        gap: 10px;
        padding: 2px 14px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .ev .ts {
        color: var(--fg-4);
      }
      .ev .tname {
        color: var(--fg-2);
      }
      .ev .tdet {
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }

      /* the timeline: one call's events, in the centre */
      .tl-h .btn {
        flex: none;
      }
      /* the header and the chips stay pinned while the timeline scrolls under them */
      .tl-top {
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .tl-f {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .tl-f .n {
        color: var(--fg-4);
      }
      .tl-f .f-errors.on {
        color: var(--err);
      }
      .tl {
        padding: 8px 0 18px;
      }
      .tl .ev {
        padding: 4px 14px;
        font-size: 12px;
        align-items: flex-start;
      }
      .tl .ev .ts {
        flex: none;
        padding-top: 2px;
        font-size: 10.5px;
      }
      .tl .col {
        flex: 1;
        min-width: 0;
      }
      .tl .col p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
      }
      .tl .tht p {
        font-family: var(--sans);
        font-style: italic;
        color: var(--fg-3);
      }
      .tl .msg p {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--fg);
        padding: 6px 10px;
        border-left: 2px solid var(--run);
        background: var(--panel-2);
        border-radius: 0 6px 6px 0;
      }
      .tcall {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        overflow: hidden;
      }
      .trow {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        padding: 5px 9px;
      }
      button.trow:hover {
        background: var(--hover);
      }
      .trow .tname {
        flex: none;
        color: var(--fg-2);
        font-weight: 600;
      }
      .trow .tdet {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tcall.open .trow .tdet {
        white-space: normal;
      }
      .tmeta {
        flex: none;
        display: flex;
        gap: 8px;
        color: var(--fg-4);
      }
      .t-completed .mark {
        color: var(--ok);
      }
      .t-failed .mark {
        color: var(--err);
      }
      .t-denied {
        border-color: color-mix(in srgb, var(--warn) 40%, transparent);
      }
      .t-denied .mark {
        color: var(--warn);
      }
      .t-running .mark {
        color: var(--run);
        animation: pulse 1.2s infinite;
      }
      .tout {
        padding: 8px 9px;
        border-top: 1px solid var(--line);
        background: var(--inset);
      }
      .tout .code {
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        margin-bottom: 8px;
      }
      .tl-sep {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 14px 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .tl-sep::before,
      .tl-sep::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .streaming,
      .logend {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 14px 0;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-3);
      }
      .streaming i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--run);
        animation: pulse 1.2s infinite;
      }
      .logend {
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      /* the inspector */
      .inspector {
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .inspector-b {
        flex: 1;
        overflow-y: auto;
      }
      .ins-h {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      .tab,
      .tog {
        font-family: var(--mono);
        font-size: 11px;
        padding: 4px 9px;
        border-radius: 5px;
        color: var(--fg-3);
      }
      .tab:hover,
      .tog:hover {
        background: var(--hover);
      }
      .tab.on,
      .tog.on {
        background: var(--panel-2);
        color: var(--fg);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .ins-b {
        padding: 12px;
      }
      .logbar {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .kv {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 3px 10px;
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .kv dt {
        color: var(--fg-4);
      }
      .kv dd {
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .polylist li {
        list-style: none;
        padding-left: 12px;
        position: relative;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-2);
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .polylist li::before {
        content: "·";
        position: absolute;
        left: 2px;
        color: var(--fg-4);
      }
      .art {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        margin-bottom: 6px;
      }
      .art .ic {
        color: var(--fg-3);
      }
      .art b {
        display: block;
        font-size: 12.5px;
      }
      .art .d {
        display: block;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .art-open {
        text-align: left;
        color: var(--fg);
      }
      .art-open:hover {
        text-decoration: underline;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        width: min(760px, 92vw);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -12px 0 32px rgba(0, 0, 0, 0.35);
        animation: drawer-in 0.15s ease-out;
      }
      .drawer:empty {
        display: none;
      }
      @keyframes drawer-in {
        from {
          transform: translateX(24px);
          opacity: 0;
        }
      }
      .drawer-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-h > span {
        flex: 1;
        min-width: 0;
      }
      .drawer-h b {
        display: block;
        font-size: 14px;
      }
      .drawer-h .d {
        display: block;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .drawer-b {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 28px;
      }
      .drawer-b > .code {
        white-space: pre-wrap;
      }
      .drawer .md {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--fg);
        overflow-wrap: anywhere;
      }
      .drawer .md h1,
      .drawer .md h2,
      .drawer .md h3,
      .drawer .md h4,
      .drawer .md h5,
      .drawer .md h6 {
        margin: 1.2em 0 0.5em;
        line-height: 1.3;
      }
      .drawer .md h1 {
        font-size: 20px;
      }
      .drawer .md h2 {
        font-size: 17px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--line);
      }
      .drawer .md h3 {
        font-size: 14.5px;
      }
      .drawer .md p,
      .drawer .md ul,
      .drawer .md ol,
      .drawer .md blockquote,
      .drawer .md table,
      .drawer .md pre {
        margin: 0 0 0.8em;
      }
      .drawer .md ul,
      .drawer .md ol {
        padding-left: 1.5em;
      }
      .drawer .md li.task {
        list-style: none;
        margin-left: -1.3em;
      }
      .drawer .md code {
        font-family: var(--mono);
        font-size: 12px;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--panel-2);
      }
      .drawer .md pre {
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--inset);
        border: 1px solid var(--line);
        overflow-x: auto;
      }
      .drawer .md pre code {
        padding: 0;
        background: none;
      }
      .drawer .md blockquote {
        padding-left: 12px;
        border-left: 3px solid var(--line);
        color: var(--fg-3);
      }
      .drawer .md table {
        border-collapse: collapse;
      }
      .drawer .md th,
      .drawer .md td {
        padding: 4px 10px;
        border: 1px solid var(--line);
      }
      .drawer .md hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 1.2em 0;
      }
      .drawer .md a {
        color: var(--run);
      }
      .drawer .md .md-img {
        color: var(--fg-3);
      }
      .mini {
        margin: 6px 0;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .mini.deny {
        border-color: color-mix(in srgb, var(--warn) 40%, transparent);
        background: color-mix(in srgb, var(--warn) 5%, var(--panel));
      }
      .mini-h {
        padding: 6px 11px;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--warn);
        border-bottom: 1px solid color-mix(in srgb, var(--warn) 25%, transparent);
      }
      .mini-b {
        padding: 8px 11px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 0 12px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-3);
      }
      .status b {
        color: var(--fg-2);
      }
      .status .w {
        color: var(--warn);
      }
      :root[data-inspector="closed"] .inspector,
      :root[data-inspector="closed"] .resize-right {
        display: none;
      }
      /* from 1100px the open inspector is a column of the grid */
      @media (min-width: 1100px) {
        :root[data-inspector="open"] .body {
          grid-template-columns: var(--side-w, 180px) 5px minmax(0, 1fr) 5px var(--ins-w, 360px);
        }
        :root[data-detail="open"][data-inspector="open"] .body {
          grid-template-columns: var(--side-w, 180px) 5px minmax(0, var(--list-w, 340px)) minmax(320px, 1fr) 5px var(--ins-w, 360px);
        }
      }
      /* under it the open inspector lies over the right of the centre and takes no column */
      @media (max-width: 1099px) {
        .resize-right {
          display: none;
        }
        .inspector {
          position: fixed;
          top: 46px;
          right: 0;
          bottom: 26px;
          width: min(var(--ins-w, 360px), 100vw);
          z-index: 15;
          box-shadow: -12px 0 32px rgba(0, 0, 0, 0.35);
        }
        .ins-close {
          display: inline-flex;
          position: absolute;
          top: 7px;
          right: 8px;
          z-index: 1;
        }
        .inspector .ins-h {
          padding-right: 44px;
        }
      }
      /* under 800px the page is one column: the list, or the open run or queue with a way back */
      @media (max-width: 799px) {
        .body,
        :root[data-detail="open"] .body {
          grid-template-columns: minmax(0, 1fr);
        }
        .resize-handle {
          display: none;
        }
        .side {
          display: none;
        }
        :root[data-sidebar="open"] .side {
          display: block;
          position: fixed;
          top: 46px;
          left: 0;
          bottom: 26px;
          width: min(260px, 80vw);
          z-index: 30;
          background: var(--panel);
          box-shadow: 12px 0 32px rgba(0, 0, 0, 0.35);
        }
        :root[data-detail="open"] .list {
          display: none;
        }
        .sidebar-btn {
          display: inline-flex;
        }
        :root[data-detail="open"] .back {
          display: inline-flex;
          align-self: flex-start;
          margin: 8px 12px 0;
        }
        .brand-t {
          display: none;
        }
        .status {
          overflow: hidden;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <button class="btn sidebar-btn" type="button" data-action="toggle-sidebar" aria-label="sidebar" title="sidebar">☰</button>
        <div class="brand"><i></i><span class="brand-t">sail dashboard</span></div>
        <div class="spacer"></div>
        <div id="link"></div>
        <button class="btn" type="button" data-action="toggle-theme" aria-label="switch theme" title="theme">◐</button>
        <button class="btn" type="button" data-action="toggle-inspector" aria-label="pin inspector" title="pin the inspector (i)">⇥</button>
      </header>
      <div class="body" id="body">
        <nav class="side">
          <div id="sidebar"></div>
        </nav>
        <div class="resize-handle" data-resize="left"></div>
        <section class="list">
          <div id="list"></div>
        </section>
        <main class="main">
          <button class="btn back" type="button" data-action="close-detail" title="back to the list (Esc)">‹ list</button>
          <div id="main"></div>
        </main>
        <div class="resize-handle resize-right" data-resize="right"></div>
        <aside class="inspector">
          <button class="btn ins-close" type="button" data-action="close-inspector" aria-label="close inspector" title="close the inspector (Esc)">✕</button>
          <div class="inspector-b" id="inspector"></div>
        </aside>
      </div>
      <footer class="status" id="status"></footer>
      <aside class="drawer" id="drawer"></aside>
      <!-- biome-ignore lint/a11y/noRedundantRoles: older browsers and the review read the role off the element -->
      <dialog id="dialog" class="dlg" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></dialog>
      <div id="menu" class="menu"></div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </div>
    <script type="module" id="sail-page"></script>
  </body>
</html>
