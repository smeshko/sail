[test]
preload = ["./test/setup.ts"]
# Lines only, per file. `functions = 0` turns off the 90% function threshold Bun applies by default when only lines is set.
coverageThreshold = { lines = 0.8, functions = 0 }
coverageSkipTestFiles = true
# The gate's visible exclusions. src/cli/main.ts is the bin shim: importing it runs the CLI, so
# test/cli/main.test.ts covers it in a subprocess instead. `../**` is outside the checkout: the temp copies of the
# fixture repository's .sail/ that tests load, which are data like test/fixtures itself.
coveragePathIgnorePatterns = ["test/**", "src/cli/main.ts", "../**"]
