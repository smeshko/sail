name: verify
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
permissions:
  contents: read
jobs:
  # Branch protection on staging requires a check named `verify`: this job id, with no `name:`. Renaming it breaks the gate.
  verify:
    runs-on: ubuntu-latest
    # A run takes 5-9 minutes; one that hangs ends as timed_out, which the review's merge step reruns once (ADW-447).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify
