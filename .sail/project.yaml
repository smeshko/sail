# sail's own config: sail runs its factory workflow on its own tickets, from Linear team ADW, and opens its pull
# requests on GitHub. Set every port back to `fake` to run on the seeds under .sail/fake/ at no cost.

# The repository's name, unique among this machine's watchers.
name: sail
# The sail versions this .sail/ runs on.
sail: ">=0.0.0 <1"
# The label that designates a ticket for sail.
label: factory
# The workflow `sail <ticket>` runs when --workflow is left out.
defaultWorkflow: factory

# Which adapter fills each port.
adapters:
  # Open moves the ticket to In Review once its pull request is up.
  ticketSource: { use: linear, team: ADW, inReview: In Review }
  codeHost: { use: github }
  harness: { use: claude-code }
  # Each run's workspace is a fresh worktree: its setup installs the dependencies before any stage runs, then copies the
  # clone's docs/ Markdown (ADRs, plans, epics) in for agents to read; git ignores the copy. The guard is for a branch
  # from before scripts/workspace-docs.ts, which lacks it.
  workspace: { use: git-worktree, setup: 'bun install --frozen-lockfile && { [ ! -f scripts/workspace-docs.ts ] || bun scripts/workspace-docs.ts; }' }
  # Jev answers check-tasks and check-fix before their agents run, and groom's duplicates stage asks it. Without
  # TYPESAFE_API_KEY the check agents run as before, and a groom run fails at its duplicates stage.
  jev: { use: typesafe }

models:
  default: claude-sonnet-5-5
  deep: claude-opus-5-5
  fast: claude-haiku-5-5
# No dollar cap on the run: each agent stage carries its own, with its turns. Minutes are wall time, which a machine
# busy with two runs and a gate stretches: each stage's maxMinutes, and the run's, only stop a session that hung.
budgets: { run: { maxMinutes: 360 } }
# AGENTS.md carries the conventions, and CONTEXT.md the vocabulary every identifier and commit message uses.
conventions: [AGENTS.md, CONTEXT.md]
